<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FALLSIDE — Flip the Fall</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #06182e;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* The game draws at a fixed 1280x720 and scales to fit the window. */
  #game {
    display: block;
    width: min(100vw, 177.78vh);
    height: auto;
    aspect-ratio: 16 / 9;
    background: #0a2c54;
    cursor: pointer;
    touch-action: none;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="FALLSIDE: run with A and D, jump with Space, flip gravity with F, reach the golden portal"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
